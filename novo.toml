[package]
name        = "markdown-nv"
version     = "0.1.0"
description = "CommonMark 0.31.2 plus the GFM tables, strikethrough, task lists, footnotes and extended autolinks, as a pull parser whose events carry byte ranges into the caller's source rather than copied strings, a flat-arena tree built from the same events, and an HTML renderer that appends to a buffer the caller owns.  Raw HTML is escaped by default and a link destination is admitted by a rule the caller supplies, because the input to a Markdown renderer is usually a document somebody else wrote."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`.  A parser over a string the caller already holds, events that
# are pairs of integers, and a renderer that appends to the caller's
# buffer: nothing is read and nothing is written.
#
# No device claim: the event list, the block arena and the inline arena
# all grow with the document.
layer       = "core"

category    = "text"

tags        = ["markdown", "commonmark", "gfm", "pull-parser", "html", "renderer", "pulldown-cmark", "sans-io", "zero-copy"]
repository  = "https://github.com/novolang/markdown-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "CommonMark as a pull parser, a tree, and a renderer"

[dependencies]
# unicode-nv, because CommonMark is defined in terms of Unicode in two
# places, and an ASCII approximation renders a different document in
# each:
#
#   Section 6.2, the left- and right-flanking rules, are written in
#   terms of a "Unicode whitespace character" and a "Unicode punctuation
#   character", and the second means the P and the S categories.
#
#   Section 4.7, link reference matching, compares labels after Unicode
#   case folding, so `[STRASSE]` finds `[straße]: /url`.
unicode-nv = "^0.1.3"
